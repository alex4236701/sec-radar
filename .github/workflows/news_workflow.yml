name: Commercial News Bot

on:
  schedule:
    # 平日時段（UTC 週日至週四，換算台灣週一至週五盤中與日常常規巡檢）
    - cron: '30 13-21 * * 0-4'   # 盤中密集時段 (台灣 21:30 - 05:30)
    - cron: '30 1,5,9 * * 1-5'    # 離峰時段 (台灣 09:30, 13:30, 17:30)
    
    # 假日時段（UTC 週五晚上至週日，換算台灣週六至週日，排程直接降為每 8 小時觸發一次）
    - cron: '30 0,8,16 * * 5-6'   # 台灣時間週六與週日的 08:30, 16:30, 00:30
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run News Monitor Script
        env:
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python monitor_news.py

      - name: Commit and Push Sent History & Weekend Timestamp
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch sent_news_log.txt
          touch weekend_last_run.txt
          # 關鍵修正：同時追蹤新聞歷史庫與週末時間戳
          git add sent_news_log.txt weekend_last_run.txt
          if [ -n "$(git status --porcelain sent_news_log.txt weekend_last_run.txt)" ]; then
            git commit -m "chore: update sent news history & weekend state [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin main
          else
            echo "無新新聞紀錄或時間戳需更新。"
          fi
