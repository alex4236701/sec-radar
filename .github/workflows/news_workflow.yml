name: Commercial News Bot

on:
  schedule:
    # 盤中高頻期 (台灣 21:30 - 05:30)
    - cron: '30 13-21 * * *'
    # 離峰時段 (台灣 09:30, 13:30, 17:30)
    - cron: '30 1,5,9 * * *'
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run News Monitor Script
        env:
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python monitor_news.py

      - name: Commit and Push Sent History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch sent_news_log.txt
          git add sent_news_log.txt
          if [ -n "$(git status --porcelain sent_news_log.txt)" ]; then
            git commit -m "chore: update sent news history [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "無新新聞審查紀錄需更新。"
          fi
