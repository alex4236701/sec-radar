name: SEC EDGAR Radar Bot

on:
  schedule:
    # 1. 美股開盤與官方受理尖峰（平日高頻）：
    # 涵蓋美東發稿時段（對應 UTC 週一至週五 10:00 至 23:00），每小時 00 分巡檢一次
    - cron: '0 10-23 * * 1-5'

    # 2. 平日夜間/離峰保險（每 4 小時一次）：
    - cron: '0 2,6 * * 1-5'

    # 3. 週末完全休市時段（UTC 週六與週日）：
    # 降頻為每 8 小時執行一次（UTC 04:00, 12:00, 20:00），節省 80% 虛擬機額度
    - cron: '0 4,12,20 * * 0,6'

  workflow_dispatch:

jobs:
  run-sec-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SEC Monitor Script
        env:
          DISCORD_SEC_WEBHOOK: ${{ secrets.DISCORD_SEC_WEBHOOK }}
          DISCORD_NEWS_WEBHOOK: ${{ secrets.DISCORD_NEWS_WEBHOOK }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python monitor_sec.py

      - name: Commit and Push SEC History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch sent_sec_log.txt
          git add sent_sec_log.txt
          if [ -n "$(git status --porcelain sent_sec_log.txt)" ]; then
            git commit -m "chore: update sec filing history [skip ci]"
            # 取得遠端最新進度（例如新聞機器人剛推的 log），並把本地這筆 commit 墊在最上方
            git pull --rebase origin main
            git push origin main
          else
            echo "無新 SEC 申報紀錄需更新。"
          fi
